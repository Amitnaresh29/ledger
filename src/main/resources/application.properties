 spring.application.name=ledger

  # --- database ---
  spring.datasource.url=jdbc:postgresql://localhost:5433/ledger
  spring.datasource.username=ledger
  spring.datasource.password=ledger

  # --- JPA ---
  # Flyway owns the schema; Hibernate must never modify it.
  spring.jpa.hibernate.ddl-auto=validate
  spring.jpa.open-in-view=false
  spring.jpa.properties.hibernate.jdbc.time_zone=UTC